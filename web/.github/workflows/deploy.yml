name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; uno nuevo espera a que termine el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # necesario para obtener el token OIDC

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::989983386152:role/twoffactor-github-deploy
  S3_BUCKET: twoffactor.com
  CF_DISTRIBUTION_ID: EDTVZLGJT7SPC

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build:static

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Upload to S3 and invalidate CloudFront
        run: bash scripts/deploy-s3.sh
