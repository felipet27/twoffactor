AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sitio estatico twoffactor.com - hosted zone, certificado ACM, bucket S3
  privado y CloudFront con OAC.

# Despliegue (us-east-1, obligatorio por el certificado de CloudFront):
#   aws cloudformation deploy --profile twoffactor --region us-east-1 \
#     --stack-name twoffactor-site --template-file infra/site.yml \
#     --parameter-overrides EnableAlias=true
#
# EnableAlias=false crea la distribucion sin el dominio; se usa solo durante
# la migracion, mientras el alias sigue en la distribucion de otra cuenta.

Parameters:
  DomainName:
    Type: String
    Default: twoffactor.com
  BucketName:
    Type: String
    Default: twoffactor-com-site
  EnableAlias:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  AliasEnabled: !Equals [!Ref EnableAlias, "true"]

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName

  # Correo y verificacion de Google Workspace.
  MxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: MX
      TTL: "300"
      ResourceRecords:
        - 1 SMTP.GOOGLE.COM

  GoogleVerificationRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - '"google-site-verification=PRzOrCNUWbce132PwKchks7WXya2WC9sfROXycAXlVo"'

  # CloudFormation escribe el CNAME de validacion en HostedZone; mientras la
  # zona no sea la autoritativa, hay que copiarlo a la zona que lo sea.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${BucketName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Sitio estatico ${DomainName}
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [AliasEnabled, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized: respeta el Cache-Control de deploy-s3.sh.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        # Con OAC, S3 responde 403 a objetos inexistentes.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  ApexARecord:
    Type: AWS::Route53::RecordSet
    Condition: AliasEnabled
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # zona fija de CloudFront

  ApexAaaaRecord:
    Type: AWS::Route53::RecordSet
    Condition: AliasEnabled
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  HostedZoneId:
    Value: !Ref HostedZone
  NameServers:
    Description: Nameservers a configurar en GoDaddy.
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
  CertificateArn:
    Value: !Ref Certificate
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
